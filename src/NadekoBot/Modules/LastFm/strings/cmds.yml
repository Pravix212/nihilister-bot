login:
  desc: Link your Last.fm account to your Discord profile.
  ex:
    - 'your_lastfm_username'
  params:
    - username:
        desc: Your Last.fm username.

fm:
  desc: Show your currently playing or last scrobbled track from Last.fm.
  ex:
    - ''
    - '@user'
  params:
    - {}
    - user:
        desc: The user to check.

topartists:
  desc: Show your top artists on Last.fm for a given time period.
  ex:
    - ''
    - '7day'
    - '1month'
  params:
    - {}
    - period:
        desc: Time period. overall, 7day, 1month, 3month, 6month, 12month.
