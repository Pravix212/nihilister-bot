login:
  desc: Link your Last.fm account to your Discord profile.
  ex:
    - 'your_lastfm_username'
  params:
    - username:
        desc: Your Last.fm username.

fm:
  desc: Show your currently playing or last scrobbled track from Last.fm.
  ex:
    - ''
    - '@user'
  params:
    - {}
    - user:
        desc: The user to check.

topartists:
  desc: Show your top artists on Last.fm for a given time period.
  ex:
    - ''
    - '7day'
    - '1month'
  params:
    - {}
    - period:
        desc: Time period. overall, 7day, 1month, 3month, 6month, 12month.

recent:
  desc: Show your plays on Last.fm.
  ex:
    - ''
  params:
    - {}

topalbums:
  desc: Show your top albums on Last.fm for a given time period.
  ex:
    - ''
    - '7day'
    - '1month'
  params:
    - {}
    - period:
        desc: Time period. overall, 7day, 1month, 3month, 6month, 12month.

toptracks:
  desc: Show your top tracks on Last.fm for a given time period.
  ex:
    - ''
    - '7day'
    - '1month'
  params:
    - {}
    - period:
        desc: Time period. overall, 7day, 1month, 3month, 6month, 12month.

fmlyrics:
  desc: Show lyrics for your currently playing or last scrobbled track from Last.fm.
  ex:
    - ''
    - '@user'
  params:
    - {}
    - user:
        desc: The user to check lyrics for.

whoknows:
  desc: Show who in this server listens to an artist the most. Crown goes to #1.
  ex:
    - ''
    - 'The Beatles'
  params:
    - {}
    - artist:
        desc: Artist name to search. If omitted, uses your currently playing artist.
