name: CI

on:
  push:
    branches: [ v6 ]
  pull_request:
    branches: [ v6 ]

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore "Nihilister Bot.sln"

    - name: Build
      run: dotnet build "Nihilister Bot.sln" -c Release --no-restore

    - name: Test
      run: dotnet test "Nihilister Bot.sln" -c Release --no-build --verbosity normal
