widgetsetup:
  desc: Sets up the Discord profile widget by providing an OAuth2 authorization link.
  ex:
    - ''
  params: []

widgetrefresh:
  desc: Manually refreshes the Discord profile widget with live bot stats (commands ran, uptime, etc.).
  ex:
    - ''
  params: []

widgetauto:
  desc: Toggles automatic widget refresh every 5 minutes. Run again to stop.
  ex:
    - ''
  params: []

widgetbalance:
  desc: Sets the remaining prepaid balance for Grok/AI API token cost calculation.
  ex:
    - '5.88'
  params:
    - amount:
        desc: The remaining balance in USD.

widgetlimit:
  desc: Sets the total budget limit for Grok/AI API token cost percentage calculation.
  ex:
    - '20.00'
  params:
    - amount:
        desc: The maximum budget limit in USD.

