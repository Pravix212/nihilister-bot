name: CI

on:
  push:
    branches: [ v6 ]
  pull_request:
    branches: [ v6 ]

env:
  DOTNET_VERSION: '9.0.100'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Verify .NET version
      run: dotnet --version

    - name: Build StringMerger first (dependency for MergeStringsTask)
      run: dotnet build src/NadekoBot.StringsMerger/NadekoBot.StringsMerger.csproj -c Release

    - name: Restore dependencies
      run: dotnet restore "Nihilister Bot.sln"

    - name: Build
      run: dotnet build "Nihilister Bot.sln" -c Release --no-restore

    - name: Test
      run: dotnet test "Nihilister Bot.sln" -c Release --no-build --verbosity normal
